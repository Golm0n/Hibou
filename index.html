<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦉 Hibou Gamble 🦉</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Nunito:wght@400;700;900&display=swap');

:root {
  --ok-color:     #a8e6a3;
  --rare-color:   #56b4f5;
  --epic-color:   #c77dff;
  --legend-color: #ffd700;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0010;
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  color: #fff;
  overflow-x: hidden;
}

/* ── ROULETTE ── */
.roulette-wrapper {
  position: relative;
  width: 100%;
  height: 160px;
  margin: 1.5rem 0;
  background: rgba(0,0,0,0.8);
  border-top: 2px solid rgba(255,255,255,0.1);
  border-bottom: 2px solid rgba(255,255,255,0.1);
  overflow: hidden;
}

.roulette-wrapper::after {
  content: '';
  position: absolute;
  left: 50%; top: 0;
  width: 4px; height: 100%;
  background: #fff;
  z-index: 50;
  box-shadow: 0 0 15px #fff;
  transform: translateX(-50%);
}

.roulette-track {
  display: flex;
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  align-items: center;
}

.roulette-item {
  width: 130px;
  height: 120px;
  margin: 0 5px;
  flex-shrink: 0;
  border-radius: 12px;
  background-size: cover;
  background-position: center;
  border-bottom: 6px solid #222;
  transition: all 0.5s ease;
  position: relative;
}

/* ANTI-SPOIL : Cache l'image par un bloc de couleur vive flou */
.roulette-track.spinning .roulette-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background-color: var(--item-color); /* Utilise la variable injectée en JS */
  filter: blur(20px);
  z-index: 8;
  border-radius: 8px;
}

.roulette-item.ok { border-color: var(--ok-color); }
.roulette-item.rare { border-color: var(--rare-color); }
.roulette-item.epic { border-color: var(--epic-color); }
.roulette-item.legendaire { border-color: var(--legend-color); }

/* ÉTAT FINAL */
.roulette-track.finished .roulette-item:not(.winner) {
  opacity: 0.2;
  filter: blur(5px) grayscale(1);
  transform: scale(0.85);
}

.roulette-track.finished .roulette-item.winner {
  opacity: 1;
  filter: blur(0);
  transform: scale(1.15);
  z-index: 10;
  box-shadow: 0 0 40px var(--drop-glow);
  border-color: var(--drop-glow);
}

/* ── ARENA ── */
.arena { position: relative; width: 350px; height: 350px; display: flex; align-items: center; justify-content: center; margin-top: 10px; }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.05); transition: 0.6s; }
.ring.ok { border-color: var(--ok-color); box-shadow: 0 0 30px var(--ok-color); }
.ring.rare { border-color: var(--rare-color); box-shadow: 0 0 50px var(--rare-color); }
.ring.epic { border-color: var(--epic-color); box-shadow: 0 0 70px var(--epic-color); }
.ring.legendaire { border-color: var(--legend-color); box-shadow: 0 0 100px var(--legend-color); }

.gif-frame { width: 85%; height: 85%; background: rgba(0,0,0,0.5); border-radius: 25px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.1); }
.gif-frame img { max-width: 95%; max-height: 95%; display: none; border-radius: 15px; }
.idle-owl { font-size: 6rem; }

.btn-drop { font-family: 'Bungee'; padding: 1.2rem 3.5rem; font-size: 1.6rem; cursor: pointer; border-radius: 60px; background: linear-gradient(135deg, #ffd700, #ff6b35); border: none; margin: 20px; box-shadow: 0 5px 20px rgba(255,100,0,0.3); color: #200; }
.btn-drop.rolling { filter: grayscale(1); pointer-events: none; opacity: 0.7; }

.rarity-badge { position: absolute; top: -15px; padding: 6px 22px; border-radius: 30px; font-family: 'Bungee'; opacity: 0; transition: 0.4s; color: #000; z-index: 10; font-size: 0.9rem; }
.rarity-badge.visible { opacity: 1; transform: translateY(0); }

.flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 100; }
.flash.fire { animation: flashAnim 0.7s ease-out; }
@keyframes flashAnim { 0% { opacity: 0.8; background: white; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<header style="text-align:center; padding-top:20px;">
  <h1 style="font-family:'Bungee Shade'; font-size:3.5rem; background:linear-gradient(gold, orange); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">HIBOU GAMBLE</h1>
</header>

<div class="roulette-wrapper">
  <div class="roulette-track" id="rouletteTrack"></div>
</div>

<div class="arena">
  <div class="ring" id="ring"></div>
  <div class="gif-frame">
    <div class="rarity-badge" id="rarityBadge"></div>
    <div class="idle-owl" id="idleOwl">🦉</div>
    <img id="gifImg" alt="Hibou"/>
  </div>
</div>

<button class="btn-drop" id="btnDrop" onclick="rollDrop()">🎲 TIRER</button>

<div style="display:flex; gap:25px; font-weight:900; font-size:1.1rem; text-transform:uppercase;">
  <div style="color:var(--ok-color)">OK: <span id="cntOk">0</span></div>
  <div style="color:var(--rare-color)">RARE: <span id="cntRare">0</span></div>
  <div style="color:var(--epic-color)">ÉPIQUE: <span id="cntEpic">0</span></div>
  <div style="color:var(--legend-color)">LÉGENDAIRE: <span id="cntLegendaire">0</span></div>
</div>

<script>
const GITHUB_USER = 'Golm0n';
const GITHUB_REPO = 'Hibou';
const BRANCH      = 'main';
const FOLDERS     = ['ok', 'rare', 'epic', 'legendaire'];
const CFG = {
  ok:         { label: '✦ OK', color: '#a8e6a3' },
  rare:       { label: '✦✦ RARE', color: '#56b4f5' },
  epic:       { label: '✦✦✦ ÉPIQUE', color: '#c77dff' },
  legendaire: { label: '✦✦✦✦ LÉGENDAIRE', color: '#ffd700' },
};

let allGifs = [];
let isRolling = false;

async function init() {
  const API = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/asset`;
  try {
    const res = await Promise.all(FOLDERS.map(f => 
      fetch(`${API}/${f}?ref=${BRANCH}`).then(r => r.json()).then(data => 
        data.filter(i => i.name.endsWith('.gif')).map(i => ({ folder: f, url: i.download_url }))
      )
    ));
    allGifs = res.flat();
  } catch(e) { console.error("Init Error", e); }
}

function rollDrop() {
  if (isRolling || allGifs.length === 0) return;
  isRolling = true;

  const track = document.getElementById('rouletteTrack');
  const btn = document.getElementById('btnDrop');
  const badge = document.getElementById('rarityBadge');
  const img = document.getElementById('gifImg');
  const idle = document.getElementById('idleOwl');

  btn.classList.add('rolling');
  track.className = 'roulette-track spinning'; 
  badge.classList.remove('visible');
  img.style.display = 'none';
  idle.style.display = 'block';

  const pick = allGifs[Math.floor(Math.random() * allGifs.length)];
  const itemCount = 50;
  const itemWidth = 140;
  const winningIndex = itemCount - 8;

  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  track.innerHTML = '';

  for (let i = 0; i < itemCount; i++) {
    const isWin = (i === winningIndex);
    const gif = isWin ? pick : allGifs[Math.floor(Math.random() * allGifs.length)];
    const div = document.createElement('div');
    
    // Injecte la couleur directement pour le pseudo-élément CSS
    div.style.setProperty('--item-color', CFG[gif.folder].color);
    div.style.backgroundImage = `url(${gif.url})`;
    div.className = `roulette-item ${gif.folder}`;
    
    if(isWin) div.id = "winnerItem";
    track.appendChild(div);
  }

  setTimeout(() => {
    track.style.transition = 'transform 4.5s cubic-bezier(0.15, 0, 0.15, 1)';
    const offset = (winningIndex * itemWidth) - (window.innerWidth / 2) + (itemWidth / 2);
    track.style.transform = `translateX(-${offset}px)`;
  }, 50);

  setTimeout(() => {
    track.classList.remove('spinning');
    track.classList.add('finished');
    
    const winItem = document.getElementById('winnerItem');
    const cfg = CFG[pick.folder];
    winItem.classList.add('winner');
    winItem.style.setProperty('--drop-glow', cfg.color);

    idle.style.display = 'none';
    img.src = pick.url;
    img.style.display = 'block';
    badge.textContent = cfg.label;
    badge.style.background = cfg.color;
    badge.classList.add('visible');
    document.getElementById('ring').className = `ring ${pick.folder}`;

    const f = document.getElementById('flash');
    f.classList.add('fire');
    setTimeout(() => f.classList.remove('fire'), 800);

    const idCount = `cnt${pick.folder.charAt(0).toUpperCase() + pick.folder.slice(1)}`;
    const el = document.getElementById(idCount);
    if(el) el.textContent = parseInt(el.textContent) + 1;

    btn.classList.remove('rolling');
    isRolling = false;
  }, 4700);
}

init();
</script>
</body>
</html>

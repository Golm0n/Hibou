<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦉 Hibou Gamble 🦉</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Nunito:wght@400;700;900&display=swap');

:root {
  --ok-color:     #a8e6a3;  --ok-glow:     #6fcf97;
  --rare-color:   #56b4f5;  --rare-glow:   #2d9ef0;
  --epic-color:   #c77dff;  --epic-glow:   #9b5de5;
  --legend-color: #ffd700;  --legend-glow: #ff9500;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0010;
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden;
  color: #fff;
}

/* ── ROULETTE STYLE CS ── */
.roulette-wrapper {
  position: relative;
  width: 100%;
  height: 140px;
  overflow: hidden;
  margin: 1rem 0;
  background: rgba(0,0,0,0.6);
  border-top: 2px solid rgba(255,255,255,0.1);
  border-bottom: 2px solid rgba(255,255,255,0.1);
  z-index: 10;
}

.roulette-wrapper::after {
  content: '';
  position: absolute;
  left: 50%; top: 0;
  width: 4px; height: 100%;
  background: #ffd700;
  z-index: 20;
  box-shadow: 0 0 15px #ffd700;
  transform: translateX(-50%);
}

.roulette-track {
  display: flex;
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  align-items: center;
}

.roulette-item {
  width: 130px;
  height: 110px;
  margin: 0 5px;
  flex-shrink: 0;
  border-radius: 10px;
  background-size: cover;
  background-position: center;
  border-bottom: 4px solid #555;
  transition: filter 0.3s;
}

.roulette-item.ok     { border-color: var(--ok-color); }
.roulette-item.rare   { border-color: var(--rare-color); }
.roulette-item.epic   { border-color: var(--epic-color); }
.roulette-item.legend { border-color: var(--legend-color); }

/* ── ARENA ── */
.arena {
  position: relative;
  width: min(480px, 90vw); height: min(480px, 90vw);
  display: flex; align-items: center; justify-content: center;
  z-index: 1; margin-top: 20px;
}

.ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.08); transition: all .4s; }
.ring.ok     { border-color: var(--ok-color);     box-shadow: 0 0 30px var(--ok-glow); }
.ring.rare   { border-color: var(--rare-color);   box-shadow: 0 0 50px var(--rare-glow); }
.ring.epic   { border-color: var(--epic-color);   box-shadow: 0 0 70px var(--epic-glow); }
.ring.legend { border-color: var(--legend-color); box-shadow: 0 0 100px var(--legend-glow); }

.gif-frame {
  position: relative; z-index: 2;
  width: 70%; height: 70%;
  display: flex; align-items: center; justify-content: center;
  border-radius: 20px; overflow: hidden;
  background: rgba(0,0,0,.3);
  border: 2px solid rgba(255,255,255,.1);
}

.gif-frame img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
.idle-owl { font-size: 5rem; animation: idleBob 2s ease-in-out infinite; }

@keyframes idleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* Copie simplifiée de tes autres styles pour la concision */
header h1 { font-family: 'Bungee Shade'; font-size: 3rem; color: gold; text-align: center; margin-top: 1rem; }
.btn-drop { font-family: 'Bungee'; padding: 1rem 2rem; font-size: 1.5rem; cursor: pointer; border-radius: 50px; background: orange; border: none; margin: 20px; }
.btn-drop.rolling { opacity: 0.5; pointer-events: none; }

.rarity-badge { position: absolute; top: -10px; z-index: 5; padding: 5px 15px; border-radius: 20px; font-weight: 900; opacity: 0; transition: 0.3s; }
.rarity-badge.visible { opacity: 1; }

.flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 100; }
.flash.fire { animation: flashAnim 0.6s ease-out; }
@keyframes flashAnim { 0% { opacity: 0.8; background: white; } 100% { opacity: 0; } }

/* Utilise tes styles précédents pour le reste (particules, compteurs, etc.) */
.rarity-counters { display: flex; gap: 1rem; margin: 10px; }
.num { font-weight: bold; font-size: 1.2rem; }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<header>
  <h1>HIBOU GAMBLE</h1>
  <p>Tire un hibou</p>
</header>

<div class="roulette-wrapper">
  <div class="roulette-track" id="rouletteTrack"></div>
</div>

<div class="arena">
  <div class="ring" id="ring"></div>
  <div class="gif-frame" id="gifFrame">
    <div class="rarity-badge" id="rarityBadge"></div>
    <div class="idle-owl" id="idleOwl">🦉</div>
    <img id="gifImg" alt="Hibou"/>
  </div>
</div>

<div class="btn-zone">
  <button class="btn-drop" id="btnDrop" onclick="rollDrop()">🎲 TIRER</button>
</div>

<div class="rarity-counters">
  <div style="color:var(--ok-color)">OK: <span class="num" id="cntOk">0</span></div>
  <div style="color:var(--rare-color)">RARE: <span class="num" id="cntRare">0</span></div>
  <div style="color:var(--epic-color)">ÉPIQUE: <span class="num" id="cntEpic">0</span></div>
  <div style="color:var(--legend-color)">LÉGENDAIRE: <span class="num" id="cntLegend">0</span></div>
</div>

<div id="statusMsg"></div>

<script>
const GITHUB_USER = 'Golm0n';
const GITHUB_REPO = 'Hibou';
const BRANCH      = 'main';

const FOLDERS = ['ok', 'rare', 'epic', 'legendaire'];
const CFG = {
  ok:         { label: '✦ OK',            cls: 'ok',     color: '#a8e6a3' },
  rare:       { label: '✦✦ RARE',         cls: 'rare',   color: '#56b4f5' },
  epic:       { label: '✦✦✦ ÉPIQUE',      cls: 'epic',   color: '#c77dff' },
  legendaire: { label: '✦✦✦✦ LÉGENDAIRE', cls: 'legend', color: '#ffd700' },
};

let allGifs = [];
let isRolling = false;

async function init() {
  const API = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/asset`;
  try {
    const results = await Promise.all(FOLDERS.map(folder =>
      fetch(`${API}/${folder}?ref=${BRANCH}`).then(r => r.json()).then(files => 
        files.map(f => ({ folder, url: f.download_url, name: f.name }))
      )
    ));
    allGifs = results.flat();
  } catch(e) { console.error("Erreur API", e); }
}

function rollDrop() {
  if (isRolling || allGifs.length === 0) return;
  isRolling = true;

  const track = document.getElementById('rouletteTrack');
  const btn = document.getElementById('btnDrop');
  btn.classList.add('rolling');

  const pick = allGifs[Math.floor(Math.random() * allGifs.length)];
  const itemCount = 45; 
  const itemWidth = 140; 

  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  track.innerHTML = '';

  // Remplissage de la roulette
  for (let i = 0; i < itemCount; i++) {
    const isFinal = (i === itemCount - 6);
    const gif = isFinal ? pick : allGifs[Math.floor(Math.random() * allGifs.length)];
    const div = document.createElement('div');
    div.className = `roulette-item ${CFG[gif.folder].cls}`;
    div.style.backgroundImage = `url(${gif.url})`;
    track.appendChild(div);
  }

  // Animation
  setTimeout(() => {
    track.style.transition = 'transform 4s cubic-bezier(0.15, 0, 0.15, 1)';
    const targetOffset = (itemCount - 6) * itemWidth;
    const centerOffset = (document.querySelector('.roulette-wrapper').offsetWidth / 2) - (itemWidth / 2);
    track.style.transform = `translateX(-${targetOffset - centerOffset}px)`;
  }, 50);

  // Reveal
  setTimeout(() => {
    const img = document.getElementById('gifImg');
    const idle = document.getElementById('idleOwl');
    const badge = document.getElementById('rarityBadge');
    const ring = document.getElementById('ring');
    const cfg = CFG[pick.folder];

    idle.style.display = 'none';
    img.src = pick.url;
    img.style.display = 'block';
    
    badge.textContent = cfg.label;
    badge.className = `rarity-badge visible ${cfg.cls}`;
    badge.style.background = cfg.color;
    ring.className = `ring ${cfg.cls}`;

    // Flash écran
    const f = document.getElementById('flash');
    f.classList.add('fire');
    setTimeout(() => f.classList.remove('fire'), 600);

    btn.classList.remove('rolling');
    isRolling = false;

    // Mise à jour compteurs (simplifié)
    const countEl = document.getElementById(`cnt${pick.folder.charAt(0).toUpperCase() + pick.folder.slice(1)}`);
    if(countEl) countEl.textContent = parseInt(countEl.textContent) + 1;

  }, 4200);
}

init();
</script>
</body>
</html>
